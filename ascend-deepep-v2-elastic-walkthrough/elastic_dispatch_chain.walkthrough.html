<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascend DeepEP V2 Elastic Dispatch 占位实现走读</title>
    <style>
:root {
  color-scheme: light;
  --paper: #f7f8fa;
  --surface: #ffffff;
  --surface-soft: #f3f5f8;
  --ink: #172033;
  --muted: #667085;
  --faint: #98a2b3;
  --line: #d9dee8;
  --line-strong: #b7c0cf;
  --accent: #2457d6;
  --accent-soft: #eaf0ff;
  --mint: #dff7ed;
  --mint-ink: #08745a;
  --amber: #9a5b05;
  --amber-bg: #fff0c7;
  --blue: #075da8;
  --blue-bg: #dceeff;
  --purple: #6b36b5;
  --purple-bg: #eee4ff;
  --cyan: #08768a;
  --cyan-bg: #ddf5f8;
  --danger: #b42318;
  --shadow: 0 12px 30px rgba(23, 32, 51, 0.09);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }

button, input { font: inherit; }

button { color: inherit; }

.boot {
  min-height: 100vh;
  display: grid;
  place-content: center;
  text-align: center;
  color: var(--muted);
}

.boot span { color: var(--accent); font: 800 34px/1 ui-monospace, monospace; }

.shell {
  height: 100vh;
  min-width: 1180px;
  display: grid;
  grid-template-rows: 68px minmax(0, 1fr);
  overflow: hidden;
}

.topbar {
  position: relative;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(280px, 1fr) auto auto;
  align-items: center;
  gap: 18px;
  padding: 9px 18px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 8px rgba(23, 32, 51, 0.04);
}
.topbar.has-workspace-tabs { grid-template-columns: minmax(250px, 1fr) auto auto auto; }

.title-block { min-width: 0; }

.eyebrow {
  margin: 0 0 3px;
  color: var(--faint);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.review-badge {
  display: inline-flex;
  align-items: center;
  min-height: 18px;
  margin-left: 8px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 9px;
  letter-spacing: .02em;
  text-transform: none;
}

.review-pass { color: #08745a; background: #dff7ed; }
.review-pending { color: #a15c00; background: #fff0c7; }
.draft-mode .topbar { border-top: 3px solid #e08b1b; }

h1 {
  margin: 0;
  overflow: hidden;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.search-box {

  height: 42px;
  padding: 0 6px 0 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  transition: border-color .15s, box-shadow .15s;
}

.search-box:focus-within {
  border-color: #90a8ed;
  box-shadow: 0 0 0 3px rgba(36, 87, 214, .10);
}

.search-icon { color: var(--muted); font-size: 15px; }

.search-box input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
}

.search-count {
  min-width: 48px;
  padding: 0 7px;
  color: var(--muted);
  font-size: 11px;
  text-align: right;
  white-space: nowrap;
}

.search-count.no-result { color: var(--danger); font-weight: 700; }

.icon-button, .drawer-toggle, .layout-reset {
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
}

.icon-button {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  color: var(--muted);
}

.icon-button:hover:not(:disabled) { border-color: var(--line-strong); color: var(--accent); }
.icon-button:disabled { cursor: default; opacity: .3; }

.topbar-actions { display: flex; align-items: center; gap: 7px; }

.workspace-view-tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: #f5f7fb; white-space: nowrap; }
.workspace-view-tabs button { height: 32px; padding: 0 11px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 800; }
.workspace-view-tabs button:hover { color: var(--accent); }
.workspace-view-tabs button.active { color: white; background: var(--accent); box-shadow: 0 4px 10px rgba(36,87,214,.18); }

.drawer-toggle, .layout-reset {
  height: 40px;
  padding: 0 13px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.drawer-toggle:hover, .layout-reset:hover { color: var(--accent); border-color: #9bb1ec; }
.layout-reset { background: #f8faff; }

.tracks {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(240px, 1fr) 8px minmax(300px, 1fr) 8px minmax(420px, 1.15fr);
  gap: 0;
  background: var(--line);
}

.tracks.memory-workspace-mode { grid-template-columns: minmax(540px, 1.7fr) 8px minmax(420px, 1fr); }
[hidden] { display: none !important; }

.column-resizer, .function-row-resizer { position: relative; z-index: 16; background: #eef1f6; outline: 0; touch-action: none; }
.column-resizer { cursor: col-resize; }
.column-resizer::before { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; border-radius: 2px; background: #c5ccd8; transition: background .12s, box-shadow .12s; }
.column-resizer:hover::before, .column-resizer:focus-visible::before, .column-resizer.active::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(36,87,214,.12); }
.layout-resizing { user-select: none; }
.layout-resizing.resize-columns, .layout-resizing.resize-columns * { cursor: col-resize !important; }
.layout-resizing.resize-rows, .layout-resizing.resize-rows * { cursor: row-resize !important; }

.track {
  min-width: 0;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--surface);
}

.track-head {
  min-height: 70px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  background: #fbfcfd;
}

.track-index {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 23px;
  height: 23px;
  margin-right: 7px;
  border-radius: 7px;
  background: var(--ink);
  color: white;
  font-size: 11px;
  font-weight: 800;
}

.track-title { display: flex; align-items: center; margin: 0 0 4px; font-size: 14px; }
.track-subtitle { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
.track-stat { color: var(--muted); font: 600 11px/1.4 ui-monospace, monospace; white-space: nowrap; }

.track-body { min-height: 0; overflow: auto; }

#e2e-body { position: relative; background: #fbfcfe; }
.e2e-toolbar {
  position: sticky;
  top: 8px;
  left: 8px;
  z-index: 15;
  display: flex;
  align-items: center;
  width: max-content;
  gap: 5px;
  margin: 8px;
  padding: 5px 6px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: rgba(255, 255, 255, .94);
  box-shadow: 0 5px 14px rgba(23, 32, 51, .08);

}
.e2e-toolbar button { min-width: 27px; height: 25px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--muted); cursor: pointer; font-size: 10px; font-weight: 800; }
.e2e-toolbar button:hover { border-color: #9bb1ec; color: var(--accent); }
.e2e-toolbar output { min-width: 38px; color: var(--muted); font: 700 9px/1 ui-monospace, monospace; text-align: center; }
.primary-path-key { display: inline-flex; align-items: center; gap: 5px; margin-right: 3px; color: var(--muted); font-size: 9px; font-weight: 700; }
.primary-path-key i { width: 14px; height: 3px; border-radius: 2px; background: var(--accent); }
.e2e-stage { position: relative; margin: 0 auto; }
.e2e-canvas {
  position: absolute;
  overflow: visible;
  transform-origin: top left;
  background-color: #fbfcfe;
  background-image: radial-gradient(#d9e0eb 0.8px, transparent 0.8px);
  background-size: 18px 18px;
}

.edge-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.edge-path { fill: none; stroke: #aab5c5; stroke-width: 1.25; opacity: .28; vector-effect: non-scaling-stroke; transition: opacity .15s, stroke-width .15s; }
.edge-path.data { stroke: #2d7eaa; }
.edge-path.sync, .edge-path.handshake { stroke: #7a4db3; stroke-dasharray: 5 4; }
.edge-path.primary { stroke: var(--accent); stroke-width: 2.6; opacity: .88; stroke-dasharray: none; }
.edge-path.related { opacity: .9; stroke-width: 2; }
.edge-label {
  position: absolute;
  z-index: 1;
  max-width: 112px;
  translate: -50% -50%;
  padding: 2px 4px;
  overflow: hidden;
  border: 1px solid rgba(210, 217, 228, .92);
  border-radius: 5px;
  background: rgba(255, 255, 255, .92);
  box-shadow: 0 1px 3px rgba(23, 32, 51, .07);
  color: #697386;
  font: 700 8px/1.15 ui-sans-serif, system-ui, sans-serif;
  opacity: .12;
  pointer-events: none;
  text-overflow: ellipsis;
  transition: opacity .15s;
  white-space: nowrap;
}
.edge-label.primary, .edge-label.related { opacity: .96; }

.module-node {
  position: absolute;
  width: 190px;
  min-height: 112px;
  translate: -50% -50%;
  padding: 9px 12px 11px;
  border: 1px solid var(--line-strong);
  border-top: 3px solid var(--node-color, var(--accent));
  border-radius: 11px;
  background: rgba(255, 255, 255, .98);
  box-shadow: 0 5px 13px rgba(23, 32, 51, .07);
  cursor: pointer;
  text-align: left;
  transition: transform .14s, border-color .14s, box-shadow .14s;
}

.module-node:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.module-node.primary { border-left: 4px solid var(--node-color, var(--accent)); }
.module-node.side { background: rgba(255, 255, 255, .94); }
.module-node.inactive { opacity: .58; border-style: dashed; }
.module-node.active {
  border-color: var(--node-color, var(--accent));
  background: var(--accent-soft);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--node-color, var(--accent)) 22%, transparent), 0 14px 30px color-mix(in srgb, var(--node-color, var(--accent)) 18%, transparent);
}
.module-node.active .module-summary { color: var(--ink); }
.module-node.inactive.active { opacity: .88; }
.module-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.module-order { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px; border-radius: 6px; background: var(--node-color, var(--accent)); color: white; font: 800 9px/1 ui-monospace, monospace; }
.module-range { overflow: hidden; color: var(--faint); font: 700 8px/1.2 ui-monospace, monospace; text-overflow: ellipsis; white-space: nowrap; }
.module-name { display: block; margin-bottom: 4px; font: 800 12px/1.25 ui-monospace, monospace; }
.module-summary { display: -webkit-box; overflow: hidden; color: var(--muted); font-size: 10px; line-height: 1.38; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.module-badge { position: absolute; top: -9px; right: 8px; padding: 2px 6px; border-radius: 8px; background: #edf0f4; color: var(--muted); font-size: 8px; font-weight: 800; }

.graph-node-popover {
  position: fixed;
  z-index: 45;
  width: min(310px, calc(100vw - 24px));
  padding: 12px 13px 11px;
  border: 1px solid #9fb0c9;
  border-radius: 11px;
  background: rgba(255, 255, 255, .98);
  box-shadow: 0 18px 42px rgba(23, 32, 51, .18);
  opacity: 0;
  pointer-events: none;
  transform: translateY(4px);
  transition: opacity .12s, transform .12s;
}
.graph-node-popover.visible { opacity: 1; transform: translateY(0); }
.graph-node-popover.pinned { border-color: var(--accent); pointer-events: auto; box-shadow: 0 0 0 3px var(--accent-soft), 0 18px 42px rgba(23, 32, 51, .2); }
.graph-node-popover-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.graph-node-popover-head div { min-width: 0; }
.graph-node-popover-head b { display: block; color: var(--ink); font: 800 12px/1.35 ui-monospace, monospace; overflow-wrap: anywhere; }
.graph-node-popover-head span { display: block; margin-top: 3px; color: var(--faint); font: 700 9px/1.35 ui-monospace, monospace; }
.graph-node-popover-head button { flex: 0 0 auto; width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: white; color: var(--muted); cursor: pointer; }
.graph-node-popover-head button:hover { border-color: #9bb1ec; color: var(--accent); }
.graph-node-popover p { margin: 9px 0 0; color: var(--ink); font-size: 11px; line-height: 1.58; overflow-wrap: anywhere; white-space: normal; }
.graph-node-popover small { display: block; margin-top: 8px; color: var(--faint); font-size: 8px; line-height: 1.35; }

.function-body { display: grid; grid-template-rows: minmax(150px, var(--function-top-height, 38%)) 8px minmax(180px, 1fr); padding: 0; overflow: hidden; background: #fbfcfe; }
.function-body.memory-workspace-body { display: grid; grid-template-rows: minmax(0, 1fr); }
.memory-full-pane { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; background: #fbfcfe; }
.memory-full-head { min-height: 46px; }
.function-dag-pane, .function-detail-pane { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.function-dag-pane { border-bottom: 1px solid var(--line-strong); background: white; }
.function-row-resizer { cursor: row-resize; }
.function-row-resizer::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 2px; border-radius: 2px; background: #c5ccd8; transition: background .12s, box-shadow .12s; }
.function-row-resizer:hover::before, .function-row-resizer:focus-visible::before, .function-row-resizer.active::before { background: var(--accent); box-shadow: 0 0 0 3px rgba(36,87,214,.12); }
.pane-head { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #f8fafc; }
.pane-head div { min-width: 0; }
.pane-head b { display: block; font-size: 10px; line-height: 1.25; }
.pane-head span { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 8px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
.pane-head em { flex: 0 0 auto; color: var(--faint); font: 700 8px/1.2 ui-monospace, monospace; font-style: normal; white-space: nowrap; }
.pane-head-side { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.middle-view-tabs { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: white; }
.middle-view-tabs button { padding: 4px 7px; border: 0; border-radius: 5px; background: transparent; color: var(--muted); cursor: pointer; font: 800 8px/1 ui-monospace, monospace; }
.middle-view-tabs button:hover { color: var(--accent); }
.middle-view-tabs button.active { background: var(--accent-soft); color: var(--accent); }
.function-dag-scroll { min-height: 0; overflow: auto; background-color: #fbfcfe; background-image: radial-gradient(#d9e0eb .7px, transparent .7px); background-size: 16px 16px; }
.function-graph-canvas { position: relative; min-width: 100%; margin: 0 auto; }
.function-edge-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.function-edge { fill: none; stroke: #8d9bb0; stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.function-edge-label { position: absolute; z-index: 1; translate: -50% -50%; padding: 1px 4px; border: 1px solid var(--line); border-radius: 5px; background: rgba(255,255,255,.94); color: var(--faint); font: 700 7px/1.2 ui-monospace, monospace; pointer-events: none; white-space: nowrap; }
.function-node { position: absolute; z-index: 2; width: 128px; min-height: 52px; translate: -50% -50%; padding: 7px 8px; overflow: hidden; border: 1px solid #c4ccd8; border-radius: 8px; background: white; box-shadow: 0 4px 10px rgba(23,32,51,.06); cursor: pointer; text-align: left; }
.function-node:hover { border-color: #8fa8ee; box-shadow: 0 7px 15px rgba(36,87,214,.1); }
.function-node.active { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(36,87,214,.1); }
.function-node.cross-module { border-style: dashed; background: #faf8ff; }
.function-node-name { display: block; overflow: hidden; color: var(--ink); font: 800 9px/1.25 ui-monospace, monospace; text-overflow: ellipsis; white-space: nowrap; }
.function-node-meta { display: block; margin-top: 4px; overflow: hidden; color: var(--muted); font: 700 7px/1.3 ui-monospace, monospace; text-overflow: ellipsis; white-space: nowrap; }
.memory-view { min-height: 0; display: grid; grid-template-rows: auto auto auto auto auto auto minmax(150px, 1fr) auto; overflow: hidden; }
.memory-view-full { min-height: 0; height: 100%; }
.resource-budget-summary { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: #eef4ff; cursor: help; }
.resource-budget-summary b { flex: 0 0 auto; color: var(--accent); font-size: 8px; }
.resource-budget-summary span { min-width: 0; overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
.resource-budget-summary em { flex: 0 0 auto; margin-left: auto; color: var(--faint); font-size: 7px; font-style: normal; }

.resource-budget-card { flex: 0 0 210px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-top: 3px solid #657084; border-radius: 8px; background: white; }
.resource-budget-card.warning { border-top-color: #d17b0f; background: #fffaf1; }
.resource-budget-card.critical { border-top-color: var(--danger); background: #fff6f5; }
.resource-budget-card.verified { border-top-color: #27805c; background: #f5fcf9; }
.resource-budget-card span { display: block; color: var(--faint); font-size: 7px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
.resource-budget-card b { display: block; margin-top: 4px; color: var(--ink); font: 800 10px/1.3 ui-monospace, monospace; overflow-wrap: anywhere; }
.resource-budget-card p { margin: 4px 0 0; color: var(--muted); font-size: 8px; line-height: 1.35; }
.memory-allocation-strip { display: flex; gap: 7px; min-height: 112px; padding: 8px 10px; overflow-x: auto; border-bottom: 1px solid var(--line); background: white; scrollbar-width: thin; }

.memory-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; overflow-x: auto; border-bottom: 1px solid var(--line); background: white; }
.memory-path-tabs, .memory-space-legend { display: flex; align-items: center; gap: 5px; white-space: nowrap; }

rce销毁时释放。common 属性要求有效 rank/npes/timeout/engine；默认 local_mem_size 在 (0,40GiB]，用户模式允许0但要求<=40GiB、页对齐且 engine 受支持；version_compatible 当前固定返回 ACLSHMEM_SUCCESS。定义 raw local slice H=heap_size：默认 H=local_mem_size+ACLSHMEM_EXTRA_SIZE；用户模式先要求 external_bytes+local_mem_size<=ACLSHMEM_MAX_LOCAL_SIZE（40GiB），再得 H=external_bytes+local_mem_size+ACLSHMEM_EXTRA_SIZE。setup_heap 以 H 请求每 Rank 物理 backing，但以 S=ALIGN_UP(H,ACLSHMEM_HEAP_ALIGNMENT_SIZE=1GiB) 排列 GVA：Rank i base=hbm_gva+S*i，最后有效 exclusive 末端=(npes-1)*S+H；allocator suffix 为 H-external_bytes=local_mem_size+EXTRA，S 只保证相对 stride，本层不验证绝对 base 的16B对齐。state init 在建流前写 g_state 三项，成功后才写 default_stream/event/block，abort 不清这些 host 字段。backend 构造忽略 aclrtGetDevice 失败；MSTX factory 普通 OOM 由 throwing new 抛 bad_alloc，须与非标准 nullptr 返回后仅日志并在首 owner 空解引用的故障分开。bind 先把 uint64 instance_id 窄化为 int、再扩成 uint64 entity_map_ key：超 int 范围可与完整 ctx id 不同，L1593 查找失败后 abort仍按完整 id清理而泄漏新 entity/user buffer；碰撞赋值还可覆盖旧裸指针。bind 同时让 entity_member 保存 attributes 裸指针；冻结 caller 的 attributes 是 InitRuntime 栈对象，返回后悬空，D2H 后续 HOST_SIDE malloc 延迟 setup_heap 时仍读 my_pe。init_device_state 的首 owner 按 hybm_init→MSTX add/register→count++→barrier，后续 owner 跳过 HYBM/MSTX 后 count++→barrier；barrier 失败 count-- 且归零才 uninit，MSTX add 异常可留下未计数 HYBM。reserve/setup 还存在无 gate 状态与 exchange_entity descLen==0 的 Rank 参与分叉。memory_manager_initialize 的 make_shared 分配失败正常抛 bad_alloc，但 noexcept 构造中的 map/set 异常触发 std::terminate；pthread_spin_init/lock/unlock 状态均不传播，16B 只保证相对 offset。signal/team 继承这些 terminate/spin 风险，且 signal memset 单 Rank失败的 free barrier 可与成功 Rank 的 team malloc barrier 错位配对；profiling 无环境时只写 host pe_id=-1，非选中 Rank不分配，选中 Rank成功后才写 g_state.profs。USER_BUFFER rollback 即使 heap_reserved=false，只要 entity input 非空也会在 release_heap 进入 collective gate，可能阻塞或错配。L1542 修改的进程 logger 由识别的 SHMEM_LOG_LEVEL 值覆盖 ERROR_LEVEL 且失败不回滚。其余首个 collective 前的本地失败、用户 gate 前 vector、默认 exchange、六张 pointer table、reach_info 与晚期子模块错误也都会缩减或错分 Rank 参与集合。","inactive":false,"inputs":["bootstrap_flags","attributes","heap_mode","buffer_ ":"call","explanation":"调用 setup_heap 建立 DEVICE_SIDE heap：默认/用户 allocation、exchange、export/import/mmap 的 gate 不同；共同 exchange_entity 还会在本地 ex_info.descLen==0 时直接跳过 allgather/barrier，若 Rank 间 descLen 不同便立即错分 collective 序列。映射后 S=ALIGN_UP(H,1GiB)，Rank i GVA=hbm_gva+S*i；三次 aclrtMallocHost、三次 aclrtMalloc 和 reach_info_init 仍可无 gate 地单 Rank失败并留下部分状态。","reads":["init_manager"],"writes":[]},{"line":1606,"kind":"blank","explanation":"分隔底层 heap 建立与逻辑 allocator；此时必须保留 H raw physical backing、S=ALIGN_UP(H,1GiB) GVA stride 和 allocator suffix 三种独立口径。","reads":[],"writes":[]},{"line":1607,"kind":"comment","explanation":"注释标记 SHMEM 子模块初始化；先在后两行建立它们共同使用的 allocator。","reads":[],"writes":[]},{"line":1608,"kind":"declaration","explanation":"计算 allocator_base=g_state.heap_base+external_bytes；g_state.heap_base 是本 Rank 的 hbm_gva+S*mype，external_bytes 只跳过 caller-owned 前缀。S 只对齐 Rank 间距，当前调用链没有显式验证 hbm_gva 或 allocator_base 的绝对16B对齐。","reads":["g_state","heap_base","external_bytes"],"writes":["allocator_base"]},{"line":1609,"kind":"call","explanation":"在 allocator_base 上创建容量 H-external_bytes=local_mem_size+ACLSHMEM_EXTRA_SIZE 的 device memory_manager。std::make_shared 自身分配失败抛 std::bad_alloc并正常展开 guard；进入 noexcept 构造后，map operator[]/set insert 分配异常会 std::terminate而不展开。pthread_spin_init 返回码被忽略，仍可能安装 shared_ptr并返回成功；16B 仅保证后续分配的相对 offset/占用长度。","reads":["allocator_base","g_state","heap_size","external_bytes"],"writes":[]},{"line":1610,"kind":"blank","explanation":"分隔 DEVICE_SIDE allocator 安装与可选 HOST_SIDE DRAM 地址空间预留。","reads":[],"writes":[]},{"line":1611,"kind":"branch","explanation":"调用 check_support_d2h 选择 host DRAM 支持路径；其结果由不同于 L1556 的 USE_ACLRT_MEM_FABRIC_HANDLE 编译宏决定。","reads":[],"writes":[]},{"line":1612,"kind":"comment","explanation":"注释规定这里只 reserve HOST_SIDE heap，不调用 setup_heap；真正映射延迟到 host malloc。","reads":[],"writes":[]},{"line":1613,"kind":"call","explanation":"调用 reserve_heap(HOST_SIDE) 创建并预留 host DRAM entity；该本地结果没有 status gate，失败 Rank 可先退出，且成功 reserve 也不由 abort guard 做 HOST_SIDE remove/release。","reads":["init_manager","HOST_SIDE"],"writes":[]},{"line":1614,"kind":"brace","explanation":"结束 check_support_d2h 控制的 HOST_SIDE reserve 分支。","reads":[],"writes":[]},{"line":1615,"kind":"call","explanation":"初始化 signal：aclshmem_malloc 的 barrier 只汇合、不汇总各 Rank allocate 结果；allocator 的 noexcept map/set 异常会 std::terminate，pthread_spin_lock/unlock 返回码也被忽略。若某 Rank 的 aclrtMemset 失败，signal_finalize 会进入 aclshmem_free barrier，而成功 Rank 已可能进入 team malloc barrier，两个不同语义的 collective 可被错位配对或使后续 Rank停滞。","reads":[],"writes":[]},{"line":1616,"kind":"call","explanation":"初始化 WORLD team 及 sync pool/counter；其 aclshmem_malloc/release 同样继承 noexcept container std::terminate 与未检查 spin lock/unlock，nullptr、host calloc、device/core 分配等本地失败也没有统一 status gate，成功 Rank 可保留 slice并继续。","reads":["g_state","mype","npes"],"writes":[]},{"line":1617,"kind":"call","explanation":"初始化 sync/FFTS 配置；本地失败没有 collective status gate，成功 Rank 会继续 profiler/update/final barrier，abort guard 也不显式 finalize team 或 signal。","reads":[],"writes":[]},{"line":1618,"kind":"statement","explanation":"在 profiler、device-state 发布和最终 barrier 前先把 g_state 标记 initialized；后续某 Rank 本地失败只由其 abort guard 清回 false。","reads":[],"writes":["g_state"]},{"line":1619,"kind":"call","explanation":"调用 prof_util_init 条件写 g_host_profs/g_state：无 SHMEM_CYCLE_PROF_PE 时只写 g_host_profs.pe_id=-1；有环境值但当前 Rank 未被选中时先清 g_host_profs 并写 pe_id、但不分配 device profiling；仅选中 Rank 在 aclrtMalloc与aclrtMemcpy 都成功后写 g_state.profs。分配/拷贝失败无统一 gate，abort 也不释放已发布的 profiling allocation。","reads":["g_host_profs","g_state"],"writes":["g_host_profs","g_state"]},{"line":1620,"kind":"call","explanation":"把完整 g_state 更新到 backend device state；该本地返回值没有跨 Rank gate，失败 Rank 退出时其他 Rank 仍会进入 L1621。","reads":[],"writes":[]},{"line":1621,"kind":"sync","explanation":"执行最终 aclshmemi_control_barrier_all；它只汇合实际到达的 Rank且不传播此前本地状态，已有 Rank 退出时其余 Rank 可停滞。","reads":[],"writes":[]},{"line":1622,"kind":"call","explanation":"读取当前 PE 编号写入初始化成功日志；日志字符串不属于运行时 reads。","reads":[],"writes":[]},{"line":1623,"kind":"call","explanation":"调用 exception_guard.release() 解除析构回调，使成功运行期继续保留异常报告设施；这不是执行 finalize。","reads":["exception_guard"],"writes":["exception_guard"]},{"line":1624,"kind":"statement","explanation":"把 init_succeeded 置真，从语义上提交初始化结果并阻止 abort lambda 清理。","reads":[],"writes":["init_succeeded"]},{"line":1625,"kind":"statement","explanation":"冻结 g_qp_config_frozen，禁止任一 ACLSHMEM instance 活跃期间修改进程级 QP 数量配置。","reads":[],"writes":["g_qp_config_frozen"]},{"line":1626,"kind":"call","explanation":"解除 init_abort_guard 的所有权，成功返回时不再执行部分资源回滚。","reads":["init_abort_guard"],"writes":["init_abort_guard"]},{"line":1627,"kind":"call","explanation":"解除 ctx_guard 的所有权，保留本次创建并已成功初始化的 instance context。","reads":["ctx_guard"],"writes":["ctx_guard"]},{"line":1628,"kind":"statement","explanation":"返回 ACLSHMEM_SUCCESS 并使底层 guard 保持解除；默认 wrapper 原样上返后，InitRuntime 先写 g_runtime_initialized，再写标量快照和可能抛 std::bad_alloc 的 g_runtime_ip_port，最后才写 transport、增加 g_runtime_refcount并置 acquired_global_runtime_。该调用位于 ShmemInstance::Init 的 try 前，字符串异常不会触发 DestroyNoThrow，可留下底层活动而 owner 提交不完整。","reads":["ACLSHMEM_SUCCESS"],"writes":[]},{"line":1629,"kind":"brace","explanation":"结束 aclshmemi_init_attr_impl 函数体。","reads":[],"writes":[]}],"segments":[{"id":"g10-context-select-and-rollback","start":1481,"end":1500,"title":"锁内创建或复用截断 key 的 context，并保存/恢复资源快照","detail":"aclshmemx_init_attr 以 DEFAULT_HEAP、nullptr/0 直接调用本函数；aclshmemx_init_attr_with_buffers 只在 HAS_ACLRT_MEM_FABRIC_HANDLE 下传 USER_BUFFER_HEAP 与 descriptors，当前冻结 E2E 只有 ShmemInstance::InitRuntime 的默认路径。L1486 已在 mutex 后、ctx/init abort guard 与首个 collective 前；L1494 可条件改写 attributes->ip_port，L1500 再搬运 resource snapshot。","kind":"guard","input_state":["ShmemInstance::InitRuntime：冻结 E2E caller，通过 aclshmemx_init_attr 间接调用","attributes：含 uint64 instance_id、ip_port 与 comm_args，可被端口选择改写","aclshmem_ctx_domain/aclshmem_resource_domain：uint32_t key 的 context 与资源快照","g_state/g_state_host/plugin_hdl/g_boot_handle/device-host managers/exception context：当前活动 globals"],"mechanism":"持有 g_aclshmem_ctx_mutex 后先做 attributes 非空门禁。instance_ctx_create 对 id==0 直接成功；任一 domain 已有截断 key 也成功且不补缺项。resource-only 时 L1493 因 ctx 缺失误置 is_new=true，create 不补 ctx，set 返回缺 ctx，guard 随后先删原 resource 再因缺 ctx 报错；ctx-only 时 is_new=false，set 的 resource operator[] 可抛 bad_alloc，或插 nullptr 后解引用且无 guard 清理。全新非零 id 可先选端口并写 attributes->ip_port，再非事务插入两个 uint32-key map；若后续回滚时该实例 active，destroy 固定切到 instance 0，不恢复任意先前 active。完整 domain 下 set_impl 先保存当前 globals，再恢复目标。","output_state":["attributes->ip_port：仅全新非零 id 且满足选择条件并成功走到写回时被条件改写","resource-only：set 缺 ctx 失败，ctx_guard 删除原 resource 后再因缺 ctx 返回错误","ctx-only：resource operator[] 可抛或插 nullptr 后解引用，is_new=false 不清理","新 active instance 回滚：切换到固定 instance 0，不保证回到进入前 active instance","完整 context：g_instance_ctx 与 globals 切到截断 key 对应目标；guard 前失败仍可能留下部分 domain"],"why":"instance_id 位宽、双 domain 完整性、端口写回和资源快照共同决定实际实例身份；必须区分固定成功、条件变更与 guard 前故障，不能把 create/set 简化为原子 context 切换。","calls":[{"name":"SHM_ASSERT_RETURN","line":1486,"type":"external"},{"name":"find","line":1493,"type":"external"},{"name":"end","line":1493,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1494,"type":"external"},{"name":"aclshmemi_instance_ctx_create","line":1494,"type":"external"},{"name":"make_scope_guard","line":1495,"type":"external"},{"name":"aclshmemi_instance_ctx_destroy","line":1497,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1500,"type":"external"},{"name":"aclshmemx_instance_ctx_set_impl","line":1500,"type":"external"}]},{"id":"g10-partial-init-abort","start":1501,"end":1536,"title":"安装部分回滚，并界定 snapshot 暂时分裂与 owner 释放时点","detail":"init_abort_guard 在 L1508 安装，早于 L1539-L1541 的重复初始化检查；它依据五个阶段标志回收部分资源。memory_manager_destroy 只 reset 当前 global shared_ptr，因此 L1500 当前 resource snapshot 会暂时延寿旧 manager，但不能绕过下一次 set_impl 的反写步骤直接复活。","kind":"guard","input_state":["init_succeeded=false 与五个阶段标志=false","id：当前 instance 编号","aclshmem_resource_domain snapshot：L1500 保存的 manager shared_ptr 与 state","init_manager/g_init_manager_count：可能属于既有或本次 instance 的共享 backend 状态"],"mechanism":"失败时无条件 reset global device/host manager，并在末尾只清 global g_state.is_aclshmem_initialized；当前 resource snapshot 暂不改写，故旧 shared_ptr/state 与已回滚 globals 暂时分裂并延寿 owner。下一次正常 instance_ctx_set_impl 无论目标是谁，都先把当前回滚 globals 覆写进当前 snapshot，再恢复目标；旧 active snapshot 因而不能直接重新发布旧 manager/true state，最后 owner 可在这次覆写或 resource 删除时析构。阶段标志只控制 heap/entity/bootstrap/backend 的部分清理；USER_BUFFER input 非空时 release_heap 即使 heap_reserved=false 仍进 collective gate，可与其他 Rank 错配。","output_state":["global aclshmemi_memory_manager/host manager：立即 reset，g_state.is_aclshmem_initialized=false","当前 resource snapshot：暂存旧 manager/true state并延长 owner 生命周期","下一次正常 set_impl：先以回滚 globals 覆写当前 snapshot，旧 active state 不可直接复活","最后 shared_ptr owner：可在 snapshot 覆写或 resource 销毁时释放","USER_BUFFER rollback：即使 heap_reserved=false 也可能进入 cleanup collective","新初始化取得的 DEVICE_SIDE heap/entity/backend：按阶段标志部分回收"],"why":"scope guard 不是事务回滚：snapshot 只造成暂时状态分裂和 owner 延寿，不是可直接重新发布的备份；同时 cleanup collective 仍依赖 Rank 同序参与。","calls":[{"name":"make_scope_guard","line":1508,"type":"external"},{"name":"SHM_LOG_WARN","line":1513,"type":"external"},{"name":"memory_manager_destroy","line":1514,"type":"internal","target":"elastic-bundle-memory-manager-destroy-1414"},{"name":"remove_heap","line":1517,"type":"external"},{"name":"release_heap","line":1519,"type":"external"},{"name":"finalize_device_state","line":1521,"type":"external"},{"name":"release_aclshmem_entity","line":1523,"type":"external"},{"name":"aclshmemi_bootstrap_finalize","line":1526,"type":"external"}]},{"id":"g10-config-and-bootstrap","start":1537,"end":1551,"title":"在首个 collective 前执行本地状态、日志、属性与 bootstrap 门禁","detail":"先检查当前 context 未初始化；aclshmemx_set_log_level 以 ERROR_LEVEL 为默认值但识别的 SHMEM_LOG_LEVEL 优先。common/default/user 属性门禁按实际条件返回；version_compatible 在当前 revision 固定返回 ACLSHMEM_SUCCESS，之后才初始化 bootstrap。","kind":"guard","input_state":["g_state 初始化状态","attributes：rank、规模、容量和 transport 属性","bootstrap_flags：bootstrap 模式"],"mechanism":"common 要求 my_pe>=0、n_pes>0、n_pes<=ACLSHMEM_MAX_PES、my_pe<n_pes、shm_init_timeout!=0、control_operation_timeout!=0、data_op_engine_type>0 且位于 valid mask；default 再要求 0<local_mem_size<=40GiB；user 则允许 local_mem_size==0，但要求 <=40GiB、按 ACLSHMEM_PAGE_SIZE 对齐并属于构建支持的 MTE/条件 UDMA engine 集合。L1546 的 version_compatible 当前只返回 SUCCESS，没有现行非零路径。其余重复状态、日志、属性与 bootstrap 本地失败仍可在首个 collective 前缩减 Rank 集合；bootstrap 成功后才置 bootstrap_initialized。","output_state":["重复 init：global manager/initialized 回滚为空/false，resource snapshot 暂存旧 manager/true state；下次 set_impl 会先以回滚 globals 覆写它","有效日志级别：识别的 SHMEM_LOG_LEVEL 值，否则为 ERROR_LEVEL","USER_BUFFER_HEAP：local_mem_size=0 仍可通过此层门禁","version_compatible：当前固定 ACLSHMEM_SUCCESS，不产生失败分支","其他本地失败：该 Rank退出，其他 Rank可继续到 collective","g_boot_handle/bootstrap_initialized=true：仅本 Rank bootstrap 成功后建立"],"why":"首个 collective 前真正可能失败的是重复状态、日志、属性及 bootstrap 建立等路径；明确排除当前恒成功的 version_compatible，才能准确定位 Rank 参与集合开始分叉的位置。","calls":[{"name":"ACLSHMEM_CHECK_RET","line":1539,"type":"external"},{"name":"aclshmemx_init_status","line":1540,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1542,"type":"external"},{"name":"aclshmemx_set_log_level","line":1542,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1543,"type":"external"},{"name":"check_user_buffer_heap_attr","line":1544,"type":"external"},{"name":"check_attr","line":1544,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1546,"type":"external"},{"name":"version_compatible","line":1546,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1549,"type":"external"},{"name":"aclshmemi_bootstrap_init","line":1549,"type":"external"}]},{"id":"g10-heap-layout-formulas","start":1552,"end":1577,"title":"计算 H raw local slice，并与 1GiB GVA stride、allocator suffix 分离","detail":"定义 H=heap_size：默认 H=local_mem_size+ACLSHMEM_EXTRA_SIZE；用户模式先要求 external_bytes+local_mem_size<=40GiB，再令 H=external_bytes+local_mem_size+ACLSHMEM_EXTRA_SIZE。setup_heap 的物理 backing 每 Rank请求 H；其 GVA stride S=ALIGN_UP(H,ACLSHMEM_HEAP_ALIGNMENT_SIZE=1GiB)，allocator 容量则是 H- _input 和 attributes 裸指针交给 entity，再按完整 ctx id 初始化 device state。bind 的 uint64→int→uint64 key 与 context id 可分离，冻结 caller 的栈 attributes 又会在延迟 HOST_SIDE setup 前失效。","kind":"compute","input_state":["g_init_manager_count/init_manager：进程共享 backend","attributes：冻结 E2E 中由 ShmemInstance::InitRuntime 栈上构造","entity_map_：uint64_t key，但 bind 先把 instance_id 窄化为 int","device_id/mstx_reg_ptr_/hybm_init_count：backend 内部状态","g_state/g_boot_handle 与 QP 配置：entity/device 初始化输入"],"mechanism":"backend 与 MSTX factory 使用 throwing new；普通 OOM 抛 bad_alloc，另保留非标准 nullptr 分支。bind 先做 uint64 instance_id→int，再把 int 转回 uint64 作为 entity_map_ key；超 int 范围可与 ctx id 不同，碰撞赋值会覆盖旧裸指针。bind 还把 attributes 保存为 entity_attr 裸指针。entity_bound 在 bind 成功后置真；init_device_state 却以完整 g_instance_ctx->id 查 map，窄化 key 不同便失败，abort 同样按完整 id 清理而泄漏新 entity/user buffer。正常命中时首 owner执行 hybm_init→MSTX add/register，后续 owner跳过，然后统一 count++→barrier。冻结 caller 返回后栈 attributes 失效；D2H 的后续 HOST_SIDE malloc 经 getory_manager 延迟 setup_heap(HOST_SIDE)，会再读 entity_attr->my_pe。","output_state":["entity_map_：保存 int 窄化后再扩成 uint64 的 key；碰撞可泄漏被覆盖旧 entity_member","entity_bound=true：bind 成功后提交，即使完整 ctx id 已无法命中新 key","L1593/abort 完整 id 查找失败：刚插 entity 与 moved user buffer 可泄漏","entity_attr：InitRuntime 返回后成为悬空栈指针，延迟 HOST_SIDE setup 仍读取 my_pe","factory throwing-new/vector OOM：std::bad_alloc；非标准 nullptr：首 owner空解引用","首 owner成功：HYBM/MSTX 后 count++；后续 owner直接 count++；二者再参加 barrier","barrier 失败：count--，归零才 hybm_uninit；MSTX add 异常可留下未计数 HYBM"],"why":"backend key 域、ctx key 域与裸指针生命周期相互独立；只有同时记录窄化、清理查找和延迟 HOST_SIDE consumer，才能判断 entity 是否可达以及 attributes 是否仍有效。","calls":[{"name":"aclshmemi_init_backend","line":1583,"type":"external"},{"name":"SHM_LOG_INFO","line":1585,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1589,"type":"external"},{"name":"bind_aclshmem_entity","line":1589,"type":"external"},{"name":"move","line":1590,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1593,"type":"external"},{"name":"init_device_state","line":1593,"type":"external"},{"name":"make_scope_guard","line":1596,"type":"external"},{"name":"aclshmemi_exception_report_finalize","line":1596,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1597,"type":"external"},{"name":"aclshmemi_exception_report_apply_deferred_config","line":1597,"type":"external"}]},{"id":"g10-reserve-gate-and-map","start":1598,"end":1606,"title":"预留 GVA 后执行模式 gate，并暴露 descLen collective 分叉","detail":"reserve_heap 先产生本 PE reserve_status，并在 hbm_gva 成功后无条件使用 MSTX；用户模式尝试 collective_status_gate，默认模式只检查本地状态。setup_heap 的共同 exchange_entity 会按本地 descLen 决定是否参加 allgather/barrier。","kind":"sync","input_state":["reserve_status：本 PE DEVICE_SIDE 预留结果","use_user_buffer_heap：决定 collective 或本地门禁","g_boot_handle：用户模式状态 allgather"],"mechanism":"reserve 的 MSTX vector 异常可发生在 hbm_gva 已取得、heap_reserved 尚未置真时。collective_status_gate 只在 all_status 分配/allgather 成功时统一用户状态。共同 exchange_entity 若某 Rank descLen==0便直接返回，而非零 Rank进入 allgather；映射后再以 S 排列 GVA、分配六张 pointer table并查询 reach info。","output_state":["一致成功：heap_reserved=true，g_state.heap_base=hbm_gva+S*mype，三组 host/device table 完整","MSTX 异常：abort 尝试 release_heap，但 registration 可部分写入","descLen Rank不一致：一部分跳过、一部分进入 exchange_entity collective","后半段单 Rank失败：heap_base 或部分 table 已写，其他 Rank继续后续 collective","用户/default 路径：各自仍有未统一的本地失败边界"],"why":"setup_heap 是多阶段 collective 与本地建表协议；只覆盖 exchange/mmap 会遗漏已经建立 GVA 后的部分资源状态和新的参与集合分叉。","calls":[{"name":"reserve_heap","line":1598,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1600,"type":"external"},{"name":"aclshmemi_collective_status_gate","line":1600,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1602,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1605,"type":"external"},{"name":"setup_heap","line":1605,"type":"external"}]},{"id":"g10-allocator-and-host-reserve","start":1607,"end":1614,"title":"切出 H-external_bytes suffix，并区分 allocator 抛出、终止与锁失效","detail":"g_state.heap_base 是 hbm_gva+S*mype；allocator_base 再加 external_bytes，容量取 H-external_bytes，而不是 S-external_bytes。S 只对齐相对 Rank 间距；代码不检查 hbm_gva/allocator_base 的绝对16B对齐。D2H 支持时只 reserve HOST_SIDE 地址空间。","kind":"compute","input_state":["g_state.heap_base：本 Rank 对称 GVA base=hbm_gva+S*mype","g_state.heap_size：raw local slice H","external_bytes：caller-owned 用户 buffer 前缀"],"mechanism":"默认 external_bytes=0；用户模式扣除前缀后 suffix=local_mem_size+EXTRA。make_shared 分配失败抛 bad_alloc并展开；noexcept memory_manager 构造中的 map/set 分配异常直接 terminate。pthread_spin_init 状态被忽略；成功 allocator 的16B只约束 relative offset。check_support_d2h 为真时再本地 reserve HOST_SIDE。","output_state":["正常成功：aclshmemi_memory_manager 管理 H 内 owned suffix","spin init失败：仍可能返回 ACLSHMEM_SUCCESS但后续互斥无保证","noexcept container异常：进程 terminate且不执行 guards","GVA stride padding 不属于容量，绝对 base 对齐未经本层验证","HOST_SIDE entity：仅 reserve且 abort 不清理"],"why":"容量正确并不等于 allocator 已安全提交；必须同时区分 owner、相对对齐、锁状态和不会返回的 noexcept 失败。","calls":[{"name":"ACLSHMEM_CHECK_RET","line":1609,"type":"external"},{"name":"memory_manager_initialize","line":1609,"type":"internal","target":"elastic-bundle-memory-manager-initialize-1400"},{"name":"check_support_d2h","line":1611,"type":"external"},{"name":"ACLSHMEM_CHECK_RET","line":1613,"type":"external"},{"name":"reserve_heap","line":1613,"type":"external"}]},{"id":"g10-submodules-and-final-barrier","start":1615,"end":1621,"title":"初始化 signal/team/sync，并按 Rank 条件发布 profiling state","detail":"依次初始化 signal、WORLD team、sync 和 profiler，再更新 device state 并进入最终 control barrier。signal/team 继承 allocator terminate/spin 风险；prof_util_init 则按环境变量与选中 Rank 条件写 g_host_profs 和 g_state.profs。","kind":"sync","input_state":["aclshmemi_memory_manager：local_mem_size+ACLSHMEM_EXTRA_SIZE 的 owned suffix","g_state.mype/npes：WORLD team 拓扑","g_host_profs：host profiler 状态"],"mechanism":"malloc barrier 不聚合 allocate 结果；nullptr Rank在 barrier 后返回而成功 Rank继续。allocator map/set 可在 noexcept 中 terminate，spin lock/unlock 错误不传播。signal memset 单 Rank失败时，其 signal_finalize→free barrier 可与成功 Rank的 team malloc barrier 错配。prof_util_init 无 SHMEM_CYCLE_PROF_PE 时只写 g_host_profs.pe_id=-1；有环境值但本 Rank非选中时清     <script>
(() => {
  "use strict";

  const payloadNode = document.getElementById("walkthrough-data");
  const payload = JSON.parse(payloadNode.textContent);
  const analysis = payload.analysis;
  const lines = payload.lines;
  const modules = analysis.modules;
  const functions = analysis.functions;
  const symbols = analysis.symbols || [];
  const memoryModel = analysis.memory_model || null;
  const memoryRegions = memoryModel?.regions || [];
  const memoryTransfers = memoryModel?.transfers || [];
  const memoryPaths = memoryModel?.paths || [];
  const memoryAllocations = memoryModel?.allocations || [];
  const resourceBudget = memoryModel?.resource_budget || null;
  const memoryReview = memoryModel?.review || null;
  const symbolMap = new Map(symbols.map((item) => [item.name, item]));
  const functionMap = new Map(functions.map((item) => [item.id, item]));
  const moduleMap = new Map(modules.map((item) => [item.id, item]));
  const memorySpaceMap = new Map((memoryModel?.spaces || []).map((item) => [item.id, item]));
  const memoryRegionMap = new Map(memoryRegions.map((item) => [item.id, item]));
  const memoryTransferMap = new Map(memoryTransfers.map((item) => [item.id, item]));
  const memoryPathMap = new Map(memoryPaths.map((item) => [item.id, item]));
  const declaredPrimaryPath = Array.isArray(analysis.primary_path)
    ? analysis.primary_path.filter((moduleId) => moduleMap.has(moduleId) && !moduleMap.get(moduleId).inactive)
    : [];
  const primaryPath = declaredPrimaryPath.length >= 2
    ? declaredPrimaryPath
    : modules.filter((item) => !item.inactive).map((item) => item.id);
  const primaryPathSet = new Set(primaryPath);
  const orderedModules = [
    ...primaryPath.map((moduleId) => moduleMap.get(moduleId)),
    ...modules.filter((item) => !primaryPathSet.has(item.id) && !item.inactive),
    ...modules.filter((item) => !primaryPathSet.has(item.id) && item.inactive),
  ];
  const moduleNumberMap = new Map(orderedModules.map((item, index) => [item.id, index + 1]));
  const lineNoteMap = new Map();
  for (const fn of functions) {
    for (const note of fn.line_notes || []) lineNoteMap.set(note.line, { ...note, functionId: fn.id });
  }
  const keywords = new Set([
    "alignas", "auto", "bool", "break", "case", "catch", "char", "class", "const", "constexpr",
    "continue", "default", "delete", "do", "double", "else", "enum", "explicit", "extern", "false",
    "float", "for", "friend", "if", "inline", "int", "long", "namespace", "new", "noexcept", "nullptr",
    "operator", "private", "protected", "public", "register", "reinterpret_cast", "return", "short", "signed",
    "sizeof", "static", "static_cast", "struct", "switch", "template", "this", "throw", "true", "try",
    "typedef", "typename", "union", "unsigned", "using", "virtual", "void", "volatile", "while"
  ]);

  const entryFunction = functions.find((item) => /^(Process|main)$/i.test(item.name)) || functions[0];
  const state = {
    moduleId: entryFunction.module_id,
    functionId: entryFunction.id,
    segmentId: entryFunction.segments[0]?.id || null,
    activeLine: entryFunction.start,
    drawerOpen: false,
    search: "",
    searchMatches: [],
    matchesByLine: new Map(),
    searchIndex: -1,
    e2eZoom: .78,
    graphInfoPinned: null,
    functionHistory: [],
    pendingHistoryRestore: false,
    workspaceView: memoryModel ? "memory" : "logic",
    memoryPathId: memoryPaths[0]?.id || null,
    transferId: memoryPaths[0]?.transfer_ids?.[0] || memoryTransfers[0]?.id || null,
    layout: {
      leftRatio: .30,
      middleRatio: .31,
      memoryRatio: .61,
      functionTopRatio: memoryModel ? .52 : .38,
    },
  };

  const esc = (value) => String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="shell ${payload.draftMode ? "draft-mode" : ""}">
      <header class="topbar ${memoryModel ? "has-workspace-tabs" : ""}">
        <div class="title-block">
          <p class="eyebrow">完整源码 · ${memoryModel ? "双模式联动" : "三轨联动"} · ${esc(analysis.language)}
            ${payload.draftMode
              ? '<span class="review-badge review-pending">函数复查未完成</span>'
              : `<span class="review-badge review-pass">独立复查 ${analysis.review_summary?.reviewed_count || functions.length}/${analysis.review_summary?.inventory_count || functions.length} PASS</span>`}
          </p>
          <h1 title="${esc(payload.sourcePath)}">${esc(analysis.title)} · ${esc(payload.sourceName)}</h1>
        </div>
        ${memoryModel ? `<div class="workspace-view-tabs" role="tablist" aria-label="切换代码逻辑与内存通信阅读模式">
          <button type="button" role="tab" data-workspace-view="memory">内存与通信</button>
          <button type="button" role="tab" data-workspace-view="logic">代码逻辑</button>
        </div>` : ""}
        <label class="search-box" aria-label="搜索全部源码">
          <span class="search-icon">⌕</span>
          <input id="source-search" type="search" autocomplete="off" spellcheck="false" placeholder="搜索全部源码" />
          <output id="search-count" class="search-count">0 / 0 · 0 行</output>
          <button id="search-prev" class="icon-button" type="button" title="上一处（Shift+Enter）" disabled>↑</button>
          <button id="search-next" class="icon-button" type="button" title="下一处（Enter）" disabled>↓</button>
        </label>
        <div class="topbar-actions">
          <button id="layout-reset" class="layout-reset" type="button" title="恢复当前阅读模式的默认布局比例">重置布局</button>
          <button id="drawer-toggle" class="drawer-toggle" type="button">图例与 Tips</button>
        </div>
      </header>
      <section class="tracks">
        <article class="track" data-track="e2e">
          <header class="track-head">
            <div>
              <h2 class="track-title"><span class="track-index">1</span>E2E 执行 DAG</h2>
              <p class="track-subtitle">编号与源码范围 · 居中关键路径 · 支持缩放</p>
            </div>
            <span id="module-stat" class="track-stat"></span>
          </header>
          <div id="e2e-body" class="track-body"></div>
        </article>
        <div class="column-resizer" data-column-resizer="left-middle" role="separator" tabindex="0" aria-label="调整 E2E 与函数列宽度" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="60" title="拖拽调整左右宽度；方向键微调；双击重置"></div>
        <article class="track" data-track="function">
          <header class="track-head">
            <div>
              <h2 id="workspace-track-title" class="track-title"><span class="track-index" data-workspace-index>2</span><span data-workspace-title>函数逻辑</span></h2>
              <p id="workspace-track-subtitle" class="track-subtitle">上：函数调用 DAG · 下：当前函数逐段理解</p>
            </div>
            <span id="function-stat" class="track-stat"></span>
          </header>
          <div id="function-body" class="track-body function-body"></div>
        </article>
        <div class="column-resizer" data-column-resizer="middle-code" role="separator" tabindex="0" aria-label="调整函数与源码列宽度" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="60" title="拖拽调整左右宽度；方向键微调；双击重置"></div>
        <article class="track code-track" data-track="code">
          <header class="track-head">
            <div>
              <h2 class="track-title"><span class="track-index" data-code-index>3</span>完整源码</h2>
              <p class="track-subtitle">悬浮行首 ↩ 可反向定位；F3 切换搜索结果</p>
            </div>
            <div>
              <div id="coverage-stat" class="track-stat"></div>
              <div class="code-legend">
                <span class="legend-dot" style="--legend:var(--amber-bg)">输入</span>
                <span class="legend-dot" style="--legend:var(--blue-bg)">输出</span>
                <span class="legend-dot" style="--legend:var(--purple-bg)">API</span>
                ${memoryModel ? '<span class="legend-dot" style="--legend:#dff7ed">当前搬运</span>' : ""}
              </div>
            </div>
          </header>
          <div class="track-body code-body"><div id="code-scroll" class="code-scroll"><div id="code-table" class="code-table"></div></div></div>
        </article>
      </section>
    </div>
    <aside id="graph-node-popover" class="graph-node-popover" role="tooltip" aria-hidden="true"></aside>
    <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"><aside id="drawer" class="drawer"></aside></div>
  `;

  const e2eBody = document.getElementById("e2e-body");
  const functionBody = document.getElementById("function-body");
  const tracks = app.querySelector(".tracks");
  const codeTable = document.getElementById("code-table");
  const searchInput = document.getElementById("source-search");
  const searchCount = document.getElementById("search-count");
  const searchPrev = document.getElementById("search-prev");
  const searchNext = document.getElementById("search-next");
  const graphNodePopover = document.getElementById("graph-node-popover");
  const drawerBackdrop = document.getElementById("drawer-backdrop");
  const drawer = document.getElementById("drawer");
  let graphInfoAnchor = null;
  let graphInfoFrame = 0;
  let resizeSession = null;
  let layoutFrame = 0;

  const layoutLimits = {
    left: 240,
    middle: 300,
    code: 420,
    functionTop: 150,
    functionBottom: 180,
    splitter: 8,
  };
  const defaultLayout = { leftRatio: .30, middleRatio: .31, memoryRatio: .61, functionTopRatio: .38 };
  const clamp = (value, minimum, maximum) => Math.min(maximum, Math.max(minimum, value));

  function applyWorkspaceMode() {
    const memoryMode = state.workspaceView === "memory" && memoryModel;
    const leftTrack = tracks.querySelector('[data-track="e2e"]');
    const leftSeparator = tracks.querySelector('[data-column-resizer="left-middle"]');
    leftTrack.hidden = Boolean(memoryMode);
    leftSeparator.hidden = Boolean(memoryMode);
    tracks.classList.toggle("memory-workspace-mode", Boolean(memoryMode));
    functionBody.classList.toggle("memory-workspace-body", Boolean(memoryMode));
    document.querySelector("[data-workspace-title]").textContent = memoryMode ? "内存申请、容量与通信流" : "函数逻辑";
    document.querySelector("[data-workspace-index]").textContent = memoryMode ? "1" : "2";
    document.querySelector("[data-code-index]").textContent = memoryMode ? "2" : "3";
    document.getElementById("workspace-track-subtitle").textContent = memoryMode
      ? "大块申请与峰值预算 · 空间切片 · 关键传输路径 · 点击定位源码"
      : "上：函数调用 DAG · 下：当前函数逐段理解";
    document.querySelectorAll("[data-workspace-view]").forEach((button) => {
      const active = button.dataset.workspaceView === state.workspaceView;
      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", String(active));
    });
  }

  function applyLayout() {
    applyWorkspaceMode();
    if (state.workspaceView === "memory" && memoryModel) {
      const availableWidth = Math.max(1, tracks.clientWidth - layoutLimits.splitter);
      const workspaceWidth = clamp(
        availableWidth * state.layout.memoryRatio,
        layoutLimits.left + layoutLimits.middle,
        availableWidth - layoutLimits.code,
      );
      state.layout.memoryRatio = workspaceWidth / availableWidth;
      tracks.style.gridTemplateColumns = `${Math.round(workspaceWidth)}px ${layoutLimits.splitter}px minmax(${layoutLimits.code}px, 1fr)`;

    }
    const availableWidth = Math.max(1, tracks.clientWidth - layoutLimits.splitter * 2);
    let leftWidth = clamp(
      availableWidth * state.layout.leftRatio,
      layoutLimits.left,
      availableWidth - layoutLimits.middle - layoutLimits.code,
    );
    let middleWidth = clamp(
      availableWidth * state.layout.middleRatio,
      layoutLimits.middle,
      availableWidth - leftWidth - layoutLimits.code,
    );
    if (availableWidth - leftWidth - middleWidth < layoutLimits.code) {
      middleWidth = Math.max(layoutLimits.middle, availableWidth - leftWidth - layoutLimits.code);
    }
    state.layout.leftRatio = leftWidth / availableWidth;
    state.layout.middleRatio = middleWidth / availableWidth;
    tracks.style.gridTemplateColumns = `${Math.round(leftWidth)}px ${layoutLimits.splitter}px ${Math.round(middleWidth)}px ${layoutLimits.splitter}px minmax(${layoutLimits.code}px, 1fr)`;

      availableHeight * state.layout.functionTopRatio,
      layoutLimits.functionTop,
      Math.max(layoutLimits.functionTop, availableHeight - layoutLimits.functionBottom),

    functionBody.style.setProperty("--function-top-height", `${Math.round(topHeight)}px`);

      renderE2E();
      centerE2EOnModule(state.moduleId, "auto");

    requestAnimationFrame(() => {
      const graphScroll = functionBody.querySelector(".function-dag-scroll");
      const activeNode = graphScroll?.querySelector(".function-node.active");
      if (graphScroll && activeNode) {
        graphScroll.scrollLeft = Math.max(0, activeNode.offsetLeft - graphScroll.clientWidth / 2);
        graphScroll.scrollTop = Math.max(0, activeNode.offsetTop - graphScroll.clientHeight / 2);
      }
      const selectedStep = functionBody.querySelector(".memory-transfer-step.selected");
      selectedStep?.scrollIntoView({ block: "nearest", inline: "center", behavior: "auto" });
      restorePinnedGraphNodeInfo();
    });
  }

  function resetLayout(scope = "all") {
    if (scope === "all" || scope === "columns") {
      state.layout.leftRatio = defaultLayout.leftRatio;
      state.layout.middleRatio = defaultLayout.middleRatio;
      state.layout.memoryRatio = defaultLayout.memoryRatio;
    }
    if (scope === "all" || scope === "rows") {
      state.layout.functionTopRatio = defaultLayout.functionTopRatio;
    }
    applyLayout();
    settleLayout();
  }

  function resizeColumns(kind, delta, start) {
    if (state.workspaceView === "memory" && memoryModel) {
      const workspaceWidth = clamp(
        start.middle + delta,
        layoutLimits.left + layoutLimits.middle,
        start.available - layoutLimits.code,
      );
      state.layout.memoryRatio = workspaceWidth / start.available;
      applyLayout();
      return;
    }
    let leftWidth = start.left;
    let middleWidth = start.middle;
    if (kind === "left-middle") {
      const pairWidth = start.left + start.middle;
      leftWidth = clamp(start.left + delta, layoutLimits.left, pairWidth - layoutLimits.middle);
      middleWidth = pairWidth - leftWidth;
    } else {
      const pairWidth = start.middle + start.code;
      middleWidth = clamp(start.middle + delta, layoutLimits.middle, pairWidth - layoutLimits.code);
    }
    state.layout.leftRatio = leftWidth / start.available;
    state.layout.middleRatio = middleWidth / start.available;
    applyLayout();
  }

  function resizeFunctionRows(delta, start) {
    const topHeight = clamp(
      start.top + delta,
      layoutLimits.functionTop,
      start.available - layoutLimits.functionBottom,
    );
    state.layout.functionTopRatio = topHeight / start.available;
    applyLayout();
  }

  function activeModule() {
    return moduleMap.get(state.moduleId) || modules[0];
  }

  function activeFunction() {
    return functionMap.get(state.functionId) || null;
  }

  function activeSegment() {
    return activeFunction()?.segments.find((item) => item.id === state.segmentId) || null;
  }

  function functionHistoryFrame(returnLine = null) {
    const fn = activeFunction();
    if (!fn) return null;
    const activeLine = Number.isInteger(returnLine) ? returnLine : state.activeLine;
    const segment = fn.segments.find((item) => activeLine >= item.start && activeLine <= item.end)
      || activeSegment()
      || fn.segments[0]
      || null;
    return {
      moduleId: fn.module_id,
      functionId: fn.id,
      segmentId: segment?.id || null,
      activeLine,
    };
  }

  function inRanges(line, ranges) {
    return ranges.some(([start, end]) => line >= start && line <= end);
  }

  function functionForLine(line) {
    return functions
      .filter((item) => line >= item.start && line <= item.end)
      .sort((a, b) => (a.end - a.start) - (b.end - b.start))[0] || null;
  }

  function moduleForLine(line) {
    const fn = functionForLine(line);
    if (fn) return moduleMap.get(fn.module_id);
    return modules.find((item) => inRanges(line, item.ranges)) || modules[0];
  }

  function moduleRangeLabel(module) {
    const ranges = module.ranges || [];
    if (ranges.length === 1) return `L${ranges[0][0]}–${ranges[0][1]}`;
    const visible = ranges.slice(0, 2).map(([start, end]) => `L${start}–${end}`).join(" · ");
    return ranges.length > 2 ? `${visible} · +${ranges.length - 2} 段` : visible;
  }

  function graphEdgePath(from, to) {
    const deltaY = to.y - from.y;
    const bend = Math.max(42, Math.abs(deltaY) * .42);
    const direction = deltaY >= 0 ? 1 : -1;
    return `M ${from.x} ${from.y} C ${from.x} ${from.y + bend * direction}, ${to.x} ${to.y - bend * direction}, ${to.x} ${to.y}`;
  }

  function calculateE2ELayout() {
    const worldWidth = 780;
    const nodeHeight = 112;
    const top = 86;
    const gap = 170;
    const centerX = worldWidth / 2;
    const positions = new Map();
    const pathIndex = new Map(primaryPath.map((moduleId, index) => [moduleId, index]));
    primaryPath.forEach((moduleId, index) => positions.set(moduleId, { x: centerX, y: top + index * gap }));

    const sideModules = modules.filter((item) => !primaryPathSet.has(item.id) && !item.inactive);
    const laneYs = { left: [], right: [] };
    for (const module of sideModules) {
      const anchors = [];
      for (const edge of module.edges || []) {
        if (pathIndex.has(edge.to)) anchors.push(pathIndex.get(edge.to));
      }
      primaryPath.forEach((sourceId, index) => {
        if ((moduleMap.get(sourceId)?.edges || []).some((edge) => edge.to === module.id)) anchors.push(index);
      });
      const sourceRatio = Math.min(1, Math.max(0, ((module.ranges?.[0]?.[0] || 1) - 1) / Math.max(1, lines.length - 1)));
      const anchor = anchors.length
        ? anchors.reduce((sum, value) => sum + value, 0) / anchors.length
        : sourceRatio * Math.max(0, primaryPath.length - 1);
      const lane = Number(module.position?.x || 50) < 50 ? "left" : "right";
      let y = top + anchor * gap;
      while (laneYs[lane].some((usedY) => Math.abs(usedY - y) < nodeHeight + 24)) y += nodeHeight + 32;
      laneYs[lane].push(y);
      positions.set(module.id, { x: lane === "left" ? 132 : worldWidth - 132, y });
    }

    let currentBottom = Math.max(
      top + Math.max(0, primaryPath.length - 1) * gap,
      ...[...positions.values()].map((item) => item.y)
    );
    const inactiveModules = modules.filter((item) => item.inactive);
    inactiveModules.forEach((module, index) => {
      const row = Math.floor(index / 2);
      const isLeft = index % 2 === 0;
      positions.set(module.id, {
        x: isLeft ? 210 : worldWidth - 210,
        y: currentBottom + 155 + row * (nodeHeight + 34),
      });
    });
    if (inactiveModules.length) currentBottom += 155 + Math.ceil(inactiveModules.length / 2) * (nodeHeight + 34);
    const worldHeight = Math.max(720, currentBottom + nodeHeight / 2 + 90);
    return { worldWidth, worldHeight, positions };
  }

  function renderE2E() {
    const oldScrollTop = e2eBody.scrollTop;
    const oldScrollLeft = e2eBody.scrollLeft;
    const layout = calculateE2ELayout();
    const primaryPairs = new Set(primaryPath.slice(0, -1).map((sourceId, index) => `${sourceId}->${primaryPath[index + 1]}`));
    const edgeRecords = modules.flatMap((source) => (source.edges || []).map((edge) => ({
      source,
      target: moduleMap.get(edge.to),
      edge,
    }))).filter((item) => item.target);
    const edges = edgeRecords.map(({ source, target, edge }) => {
      const pair = `${source.id}->${target.id}`;
      const related = source.id === state.moduleId || target.id === state.moduleId;
      return `<path class="edge-path ${esc(edge.kind)} ${primaryPairs.has(pair) ? "primary" : ""} ${related ? "related" : ""}"
        d="${graphEdgePath(layout.positions.get(source.id), layout.positions.get(target.id))}"
        marker-end="url(#arrow-${esc(edge.kind)})"></path>`;
    }).join("");
    const edgeLabels = edgeRecords.map(({ source, target, edge }) => {
      if (!edge.label) return "";
      const from = layout.positions.get(source.id);
      const to = layout.positions.get(target.id);
      const pair = `${source.id}->${target.id}`;
      const related = source.id === state.moduleId || target.id === state.moduleId;
      return `<span class="edge-label ${primaryPairs.has(pair) ? "primary" : ""} ${related ? "related" : ""}"
        style="left:${(from.x + to.x) / 2}px;top:${(from.y + to.y) / 2}px" title="${esc(edge.label)}">${esc(edge.label)}</span>`;
    }).join("");
    const nodes = orderedModules.map((module) => {
      const position = layout.positions.get(module.id);
      const number = String(moduleNumberMap.get(module.id)).padStart(2, "0");
      return `
        <button type="button" class="module-node ${module.id === state.moduleId ? "active" : ""} ${module.inactive ? "inactive" : ""} ${primaryPathSet.has(module.id) ? "primary" : "side"}"
          data-module="${esc(module.id)}" data-graph-info="module" data-info-name="${esc(module.name)}"
          data-info-meta="第 ${number} 模块 · ${esc(moduleRangeLabel(module))}${module.inactive ? " · 未激活" : ""}"
          data-info-summary="${esc(module.summary)}" aria-pressed="${String(module.id === state.moduleId)}"
          aria-label="${esc(module.name)}：${esc(module.summary)}" style="left:${position.x}px;top:${position.y}px;--node-color:${esc(module.color || "#2457d6")}">
          <span class="module-meta"><b class="module-order">${number}</b><span class="module-range">${esc(moduleRangeLabel(module))}</span></span>
          ${module.inactive ? '<span class="module-badge">未激活</span>' : ""}
          <span class="module-name">${esc(module.name)}</span>
          <span class="module-summary">${esc(module.summary)}</span>
        </button>`;
    }).join("");
    const scaledWidth = Math.round(layout.worldWidth * state.e2eZoom);
    const scaledHeight = Math.round(layout.worldHeight * state.e2eZoom);
    const horizontalGutter = Math.max(96, Math.round(e2eBody.clientWidth / 2));
    const verticalGutter = Math.max(96, Math.round(e2eBody.clientHeight / 2));
    e2eBody.innerHTML = `
      <div class="e2e-toolbar" aria-label="E2E DAG 缩放工具">
        <span class="primary-path-key"><i></i>典型路径 ${primaryPath.length} 步</span>
        <button type="button" data-e2e-zoom="out" title="缩小 E2E DAG">−</button>
        <output id="e2e-zoom-level">${Math.round(state.e2eZoom * 100)}%</output>
        <button type="button" data-e2e-zoom="in" title="放大 E2E DAG">＋</button>
        <button type="button" data-e2e-zoom="fit" title="适合当前列宽">适合</button>
      </div>
      <div class="e2e-stage" style="width:${scaledWidth + horizontalGutter * 2}px;height:${scaledHeight + verticalGutter * 2}px">
        <div class="e2e-canvas" style="left:${horizontalGutter}px;top:${verticalGutter}px;width:${layout.worldWidth}px;height:${layout.worldHeight}px;transform:scale(${state.e2eZoom})">
          <svg class="edge-layer" viewBox="0 0 ${layout.worldWidth} ${layout.worldHeight}" aria-hidden="true">
            <defs>
              <marker id="arrow-control" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#aab5c5"></path></marker>
              <marker id="arrow-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2d7eaa"></path></marker>
              <marker id="arrow-sync" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a4db3"></path></marker>
              <marker id="arrow-handshake" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7a4db3"></path></marker>
            </defs>
            ${edges}
          </svg>
          ${edgeLabels}
          ${nodes}
        </div>
      </div>`;
    requestAnimationFrame(() => {
      e2eBody.scrollTop = oldScrollTop;
      e2eBody.scrollLeft = oldScrollLeft;
    });
    document.getElementById("module-stat").textContent = `${modules.length} 模块 · ${edgeRecords.length} 边`;
  }

  function centerE2EOnModule(moduleId, behavior = "smooth") {
    requestAnimationFrame(() => {
      const node = e2eBody.querySelector(`[data-module="${moduleId}"]`);
      if (!node) return;
      const bodyRect = e2eBody.getBoundingClientRect();
      const nodeRect = node.getBoundingClientRect();
      const left = e2eBody.scrollLeft
        + nodeRect.left + nodeRect.width / 2
        - bodyRect.left - bodyRect.width / 2;
      const top = e2eBody.scrollTop
        + nodeRect.top + nodeRect.height / 2
        - bodyRect.top - bodyRect.height / 2;
      e2eBody.scrollTo({
        left: Math.max(0, left),
        top: Math.max(0, top),
        behavior,
      });
    });
  }

  function setE2EZoom(action) {
    const oldZoom = state.e2eZoom;
    if (action === "in") state.e2eZoom = Math.min(1.35, state.e2eZoom + .1);
    if (action === "out") state.e2eZoom = Math.max(.5, state.e2eZoom - .1);
    if (action === "fit") {
      const { worldWidth } = calculateE2ELayout();
      state.e2eZoom = Math.min(1, Math.max(.5, (e2eBody.clientWidth - 24) / worldWidth));
    }
    if (state.e2eZoom === oldZoom && action !== "fit") return;
    renderE2E();
    centerE2EOnModule(state.moduleId, "auto");
  }

  function renderIo(items, type) {
    if (!items?.length) return '<span class="io-token">—</span>';
    return items.map((item) => `<span class="io-token ${type}" title="${esc(symbolMap.get(item)?.description || item)}">${esc(item)}</span>`).join("");
  }

  function buildFunctionCallGraph(moduleFunctions) {
    const localIds = new Set(moduleFunctions.map((item) => item.id));
    const nodes = new Map(moduleFunctions.map((item) => [item.id, { fn: item, local: true }]));
    const edgeMap = new Map();
    for (const fn of moduleFunctions) {
      for (const segment of fn.segments || []) {
        for (const call of segment.calls || []) {
          if (call.type !== "internal" || !call.target || !functionMap.has(call.target)) continue;
          const target = functionMap.get(call.target);
          if (!nodes.has(target.id)) nodes.set(target.id, { fn: target, local: localIds.has(target.id) });
          const key = `${fn.id}->${target.id}`;
          if (!edgeMap.has(key)) edgeMap.set(key, { from: fn.id, to: target.id, lines: [] });
          edgeMap.get(key).lines.push(call.line);
        }
      }
    }
    const edges = [...edgeMap.values()];
    const indegree = new Map([...nodes.keys()].map((id) => [id, 0]));
    const outgoing = new Map([...nodes.keys()].map((id) => [id, []]));
    for (const edge of edges) {
      indegree.set(edge.to, (indegree.get(edge.to) || 0) + 1);
      outgoing.get(edge.from)?.push(edge.to);
    }
    const levels = new Map([...nodes.keys()].map((id) => [id, 0]));
    const queue = [...nodes.keys()]
      .filter((id) => indegree.get(id) === 0)
      .sort((a, b) => Number(nodes.get(b).local) - Number(nodes.get(a).local) || nodes.get(a).fn.start - nodes.get(b).fn.start);
    const remaining = new Map(indegree);
    while (queue.length) {
      const sourceId = queue.shift();
      for (const targetId of outgoing.get(sourceId) || []) {
        levels.set(targetId, Math.max(levels.get(targetId), levels.get(sourceId) + 1));
        remaining.set(targetId, remaining.get(targetId) - 1);
        if (remaining.get(targetId) === 0) queue.push(targetId);
      }
    }
    const groups = new Map();
    for (const [id, node] of nodes) {
      const level = levels.get(id) || 0;
      if (!groups.has(level)) groups.set(level, []);
      groups.get(level).push({ id, ...node });
    }
    for (const group of groups.values()) {
      group.sort((a, b) => Number(b.local) - Number(a.local) || a.fn.start - b.fn.start || a.fn.name.localeCompare(b.fn.name));
    }
    const maxGroupSize = Math.max(1, ...[...groups.values()].map((group) => group.length));
    const worldWidth = Math.max(560, maxGroupSize * 148 + 48);
    const maxLevel = Math.max(0, ...groups.keys());
    const worldHeight = Math.max(190, (maxLevel + 1) * 104 + 36);
    const positions = new Map();
    for (const [level, group] of groups) {
      group.forEach((node, index) => positions.set(node.id, {
        x: worldWidth * (index + 1) / (group.length + 1),
        y: 54 + level * 104,
      }));
    }
    return { nodes, edges, positions, worldWidth, worldHeight, localIds };
  }

  function renderFunctionCallGraph(moduleFunctions) {
    const graph = buildFunctionCallGraph(moduleFunctions);
    const edges = graph.edges.map((edge) => {
      const from = graph.positions.get(edge.from);
      const to = graph.positions.get(edge.to);
      return `<path class="function-edge" d="${graphEdgePath(from, to)}" marker-end="url(#function-arrow)"></path>`;
    }).join("");
    const labels = graph.edges.map((edge) => {
      const from = graph.positions.get(edge.from);
      const to = graph.positions.get(edge.to);
      const uniqueLines = [...new Set(edge.lines)].sort((a, b) => a - b);
      const label = uniqueLines.length === 1 ? `L${uniqueLines[0]}` : `${uniqueLines.length} 处调用`;
      return `<span class="function-edge-label" style="left:${(from.x + to.x) / 2}px;top:${(from.y + to.y) / 2}px">${label}</span>`;
    }).join("");
    const nodes = [...graph.nodes.entries()].map(([id, node]) => {
      const position = graph.positions.get(id);
      const owner = moduleMap.get(node.fn.module_id);
      const ownerLabel = node.local ? "本模块函数" : `跨模块 · ${owner?.name || "其他模块"}`;
      return `<button type="button" class="function-node ${id === state.functionId ? "active" : ""} ${node.local ? "local" : "cross-module"}"
        data-function="${esc(id)}" data-graph-info="function" data-info-name="${esc(node.fn.name)}"
        data-info-meta="${esc(ownerLabel)} · L${node.fn.start}–${node.fn.end}" data-info-summary="${esc(node.fn.summary)}"
        aria-pressed="${String(id === state.functionId)}" aria-label="${esc(node.fn.name)}：${esc(node.fn.summary)}"
        style="left:${position.x}px;top:${position.y}px">
        <span class="function-node-name">${esc(node.fn.name)}</span>
        <span class="function-node-meta">L${node.fn.start}–${node.fn.end}${node.local ? "" : ` · ${esc(owner?.name || "其他模块")}`}</span>
      </button>`;
    }).join("");
    return {
      html: `<div class="function-graph-canvas" style="width:${graph.worldWidth}px;height:${graph.worldHeight}px">
        <svg class="function-edge-layer" viewBox="0 0 ${graph.worldWidth} ${graph.worldHeight}" aria-hidden="true">
          <defs><marker id="function-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8d9bb0"></path></marker></defs>
          ${edges}
        </svg>
        ${labels}
        ${nodes}
      </div>`,
      edgeCount: graph.edges.length,
      crossCount: [...graph.nodes.values()].filter((node) => !node.local).length,
    };
  }

  function activeMemoryPath() {
    return memoryPathMap.get(state.memoryPathId) || memoryPaths[0] || null;
  }

  function activeMemoryTransfer() {
    return memoryTransferMap.get(state.transferId) || memoryTransfers[0] || null;
  }

  function memoryEdgePath(from, to, curve = 0) {
    const deltaX = to.x - from.x;
    const deltaY = to.y - from.y;
    if (Math.abs(deltaX) >= Math.abs(deltaY)) {
      const bendX = Math.max(55, Math.abs(deltaX) * .44);
      const direction = deltaX >= 0 ? 1 : -1;
      return `M ${from.x} ${from.y} C ${from.x + bendX * direction} ${from.y + curve}, ${to.x - bendX * direction} ${to.y + curve}, ${to.x} ${to.y}`;
    }
    const bendY = Math.max(55, Math.abs(deltaY) * .44);
    const direction = deltaY >= 0 ? 1 : -1;
    return `M ${from.x} ${from.y} C ${from.x + curve} ${from.y + bendY * direction}, ${to.x + curve} ${to.y - bendY * direction}, ${to.x} ${to.y}`;
  }

  function memoryEdgeCurve(transfer) {
    const siblings = memoryTransfers.filter((item) => item.from === transfer.from && item.to === transfer.to);
    if (siblings.length <= 1) return (transfer.curve || 0) * 1.45;
    const index = siblings.findIndex((item) => item.id === transfer.id);
    const siblingLane = (index - (siblings.length - 1) / 2) * 52;
    return siblingLane + (transfer.curve || 0) * .35;
  }

  function renderMemoryModel() {
    if (!memoryModel) return '<div class="empty-state">当前分析数据没有内存与搬运模型。</div>';
    const path = activeMemoryPath();
    const pathTransferIds = new Set(path?.transfer_ids || []);
    const selectedTransfer = activeMemoryTransfer();
    const moduleTransferIds = new Set(memoryTransfers
      .filter((item) => (item.module_ids || []).includes(state.moduleId))
      .map((item) => item.id));
    const selectedRegionIds = new Set(
      selectedTransfer ? [selectedTransfer.from, selectedTransfer.to] : []
    );
    const canvas = memoryModel.canvas;
    const budgetCards = (resourceBudget?.cards || []).map((card) => `
      <article class="resource-budget-card ${esc(card.level || "info")}" title="${esc((card.evidence || []).join("\n"))}">
        <span>${esc(card.label)}</span>
        <b>${esc(card.value)}</b>
        <p>${esc(card.detail)}</p>
      </article>
    `).join("");
    const allocationCards = memoryAllocations.map((allocation) => {
      const relatedRegions = (allocation.region_ids || [])
        .map((regionId) => memoryRegionMap.get(regionId)?.name || regionId)
        .join(" · ");
      return `<article class="memory-allocation-card" title="${esc((allocation.evidence || []).join("\n"))}">
        <header><span>${esc(allocation.kind)} · ${esc(allocation.scope)}</span><b>${esc(allocation.name)}</b></header>
        <div><small>容量 / 申请</small><code>${esc(allocation.capacity)}</code></div>
        <div><small>基址 / 对齐</small><code>${esc(allocation.base)} · ${esc(allocation.alignment)}</code></div>
        <div><small>生命周期 / 复用</small><span>${esc(allocation.lifetime)} · ${esc(allocation.reuse)}</span></div>
        <p>${esc(allocation.purpose)}</p>
        ${relatedRegions ? `<footer>切片：${esc(relatedRegions)}</footer>` : ""}
      </article>`;
    }).join("");
    const spaces = (memoryModel.spaces || []).map((space) => `
      <span class="memory-space-key"><i style="--space-color:${esc(space.color)}"></i>${esc(space.name)}</span>
    `).join("");
    const pathButtons = memoryPaths.map((item) => `
      <button type="button" class="memory-path-tab ${item.id === path?.id ? "active" : ""}"
        data-memory-path="${esc(item.id)}" title="${esc(item.description)}"
        style="--path-color:${esc(item.color)}">${esc(item.name)}</button>
    `).join("");
    const edges = memoryTransfers.map((transfer) => {
      const from = memoryRegionMap.get(transfer.from)?.position;
      const to = memoryRegionMap.get(transfer.to)?.position;
      if (!from || !to) return "";
      const isPath = pathTransferIds.has(transfer.id);
      const isModule = moduleTransferIds.has(transfer.id);
      const isSelected = transfer.id === selectedTransfer?.id;
      const stepIndex = path?.transfer_ids?.indexOf(transfer.id) ?? -1;
      const stepLabel = stepIndex >= 0 ? `${String(stepIndex + 1).padStart(2, "0")} · ` : "";
      const edgePath = memoryEdgePath(from, to, memoryEdgeCurve(transfer));
      return `<g class="memory-edge-group">
        <path id="memory-edge-${esc(transfer.id)}"
          class="memory-edge ${esc(transfer.kind)} ${isPath ? "active-path" : "off-path"} ${isModule ? "module-related" : ""} ${isSelected ? "selected" : ""}"
          d="${edgePath}" marker-end="url(#memory-arrow-${esc(transfer.kind)})"></path>
        <path class="memory-edge-hit" d="${edgePath}" data-transfer="${esc(transfer.id)}" role="button"
          aria-label="${esc(stepLabel + transfer.api)}：${esc(transfer.description)}" tabindex="0">
          <title>${esc(stepLabel + transfer.api)} · L${transfer.line} · ${esc(transfer.description)}</title>
        </path>
      </g>`;
    }).join("");
    const railTransferIds = [...(path?.transfer_ids || [])];
    if (selectedTransfer && !railTransferIds.includes(selectedTransfer.id)) railTransferIds.push(selectedTransfer.id);
    const transferRail = railTransferIds.map((transferId, index) => {

    return `
      ${resourceBudget ? `<div class="resource-budget-summary" title="${esc((resourceBudget.assumptions || []).join("\n"))}"><b>容量口径</b><span>${esc(resourceBudget.summary)}</span><em>悬浮查看变量与完整公式</em></div>` : ""}

          <svg class="memory-edge-layer" viewBox="0 0 ${canvas.width} ${canvas.height}" aria-hidden="true">

              <marker id="memory-arrow-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 Z"></path></marker>

  function renderMiddleTop(moduleFunctions, callGraph) {
    return `<section class="function-dag-pane">

        <div class="segment-flow">
          <div class="flow-field"><b>输入</b><span>${segment.input_state.map(esc).join("；")}</span></div>
          <div class="flow-field"><b>机制</b><span>${esc(segment.mechanism)}</span></div>
          <div class="flow-field"><b>输出</b><span>${segment.output_state.map(esc).join("；")}</span></div>

      return `
        <div class="segment-row ${segment.id === state.segmentId ? "active" : ""}">

    }).join("");
    const parentFrame = state.functionHistory[state.functionHistory.length - 1] || null;
    const parentFunction = parentFrame ? functionMap.get(parentFrame.functionId) : null;
    const breadcrumbs = state.functionHistory.map((frame, index) => {
      const item = functionMap.get(frame.functionId);
      if (!item) return "";
      return `<button type="button" data-function-history-index="${index}" title="返回 ${esc(item.name)} 的调用现场 L${frame.activeLine}">${esc(item.name)}</button><i aria-hidden="true">›</i>`;
    }).join("") + `<span aria-current="page" title="当前函数 L${fn.start}–${fn.end}">${esc(fn.name)}</span>`;
    functionBody.innerHTML = `
      ${topPane}
      <div class="function-row-resizer" data-function-row-resizer role="separator" tabindex="0" aria-label="调整函数 DAG 与逐段理解高度" aria-orientation="horizontal" aria-valuemin="20" aria-valuemax="80" title="上下拖拽调整高度；方向键微调；双击重置"></div>
      <section class="function-detail-pane">
        <header class="pane-head detail-head">
          <div><b>当前函数逐段理解</b><span>${esc(fn.name)} · L${fn.start}–${fn.end}</span></div>
          <div class="detail-head-actions">
            ${parentFunction ? `<button type="button" class="function-back" data-function-back title="返回 ${esc(parentFunction.name)} 的调用位置 L${parentFrame.activeLine}">← 返回 ${esc(parentFunction.name)}</button>` : ""}
            <em>${fn.segments.length} 块</em>
          </div>
        </header>
        <nav class="function-breadcrumbs" aria-label="函数下钻路径"><b>调用路径</b>${breadcrumbs}</nav>

            <span class="function-review ${fn.review?.status === "PASS" ? "pass" : "pending"}">${fn.review?.status === "PASS" ? `独立复查 PASS · ${esc(fn.review.reviewer)}` : "待独立函数复查"}</span>
            <div class="io-row">
              <div class="io-box"><span class="io-label">关键输入</span>${renderIo(fn.inputs, "input")}</div>
              <div class="io-box"><span class="io-label">关键输出</span>${renderIo(fn.outputs, "output")}</div>
            </div>
          </section>
          <div class="segment-list">${segments}</div>
